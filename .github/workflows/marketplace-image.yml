name: AWS Marketplace image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yumaitau/dingodocs-aws
  PRODUCT_CODE: 94sw9qy9w1xbdi51koymv06vp
  PRODUCT_SKU: prod-x5dyq2hv7quk2
  CONTRACT_DIMENSION: standard_workspace
  LICENSE_FINGERPRINT: aws:294406891311:AWS/Marketplace:issuer-fingerprint

jobs:
  amd64:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve immutable tag
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}-amd64" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=1.0.0
            COMMIT_SHA=${{ github.sha }}
            DINGODOCS_DISTRIBUTION=aws-marketplace
            AWS_MARKETPLACE_PRODUCT_CODE=${{ env.PRODUCT_CODE }}
            AWS_MARKETPLACE_PRODUCT_SKU=${{ env.PRODUCT_SKU }}
            AWS_MARKETPLACE_CONTRACT_DIMENSION=${{ env.CONTRACT_DIMENSION }}
            AWS_MARKETPLACE_LICENSE_FINGERPRINT=${{ env.LICENSE_FINGERPRINT }}
          tags: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  arm64:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve immutable tag
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}-arm64" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=1.0.0
            COMMIT_SHA=${{ github.sha }}
            DINGODOCS_DISTRIBUTION=aws-marketplace
            AWS_MARKETPLACE_PRODUCT_CODE=${{ env.PRODUCT_CODE }}
            AWS_MARKETPLACE_PRODUCT_SKU=${{ env.PRODUCT_SKU }}
            AWS_MARKETPLACE_CONTRACT_DIMENSION=${{ env.CONTRACT_DIMENSION }}
            AWS_MARKETPLACE_LICENSE_FINGERPRINT=${{ env.LICENSE_FINGERPRINT }}
          tags: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  index:
    needs: [amd64, arm64]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve immutable tags
        shell: bash
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create native multi-architecture index
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ steps.image.outputs.sha }}" \
            "${IMAGE}:${{ steps.image.outputs.sha }}-amd64" \
            "${IMAGE}:${{ steps.image.outputs.sha }}-arm64"
          docker buildx imagetools inspect \
            --raw "${IMAGE}:${{ steps.image.outputs.sha }}" \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
