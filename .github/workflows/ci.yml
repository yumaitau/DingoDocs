name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Other events get a
  # unique group, so every main commit, schedule and manual run still finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dingodocs_test
          POSTGRES_USER: dingodocs
          POSTGRES_PASSWORD: dingodocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dingodocs -d dingodocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      TEST_DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # Markdown-only pull requests still install and run the format check;
      # every other step below is gated on this.
      - id: scope
        name: Decide whether this change needs the full job
        run: scripts/ci-change-scope.sh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        if: steps.scope.outputs.full == 'true'
      - run: pnpm db:seed
        if: steps.scope.outputs.full == 'true'
      - run: pnpm typecheck
        if: steps.scope.outputs.full == 'true'
      - run: pnpm lint
        if: steps.scope.outputs.full == 'true'
      - run: pnpm format
      - run: pnpm test
        if: steps.scope.outputs.full == 'true'
      - run: pnpm build
        if: steps.scope.outputs.full == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.scope.outputs.full == 'true'
      # Run browser journeys against the production build made above, as
      # released, instead of compiling every page again under `next dev`.
      - name: Start production server
        if: steps.scope.outputs.full == 'true'
        run: |
          # setsid gives the server its own process group; `next start`
          # serves from a child process, and stopping the group stops both.
          setsid node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo "NEXT_START_PGID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 120); do
            curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/next-start.log"
          exit 1
      - run: pnpm test:e2e
        if: steps.scope.outputs.full == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Lightpanda's dev server needs port 3000 next, so wait until nothing
      # answers on it.
      - name: Stop production server
        if: always() && env.NEXT_START_PGID != ''
        run: |
          kill -- "-$NEXT_START_PGID" 2> /dev/null || true
          for _ in $(seq 30); do
            curl --silent --max-time 1 http://127.0.0.1:3000/api/health > /dev/null || exit 0
            sleep 0.5
          done
          echo "Port 3000 is still in use" >&2
          exit 1
      # Production session cookies are Secure. Lightpanda drops them over
      # plain HTTP, so its smoke tests keep using the dev server.
      - run: pnpm test:e2e:lightpanda
        if: steps.scope.outputs.full == 'true'

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - id: scope
        name: Decide whether this change needs the full job
        run: scripts/ci-change-scope.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.scope.outputs.full == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.scope.outputs.full == 'true'
        with:
          context: .
          push: false
          load: true
          tags: dingodocs:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.scope.outputs.full == 'true'
        with:
          image-ref: dingodocs:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: steps.scope.outputs.full == 'true'
        with:
          sarif_file: trivy-results.sarif

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan git history with Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
