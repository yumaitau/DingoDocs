name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-yuma-dingodocs-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    services:
      postgres:
        # ECR Public mirror of the Docker Hub image (same digest). Avoids Docker
        # Hub anonymous pull limits on shared CodeBuild egress IPs.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: dingodocs_test
          POSTGRES_USER: dingodocs
          POSTGRES_PASSWORD: dingodocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dingodocs -d dingodocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      TEST_DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
      # The CodeBuild runner is Amazon Linux 2023 (no apt), so install
      # Chromium's runtime libraries with dnf instead of --with-deps.
      - name: Install Chromium system libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          alsa-lib atk at-spi2-atk at-spi2-core cairo cups-libs dbus-libs
          libdrm libX11 libxcb libXcomposite libXdamage libXext libXfixes
          libxkbcommon libXrandr mesa-libgbm nspr nss pango
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      # The Lightpanda 0.4.0 aarch64 binary needs glibc 2.38 and Amazon Linux
      # 2023 ships 2.34, so run the same release from its official arm64 image.
      - name: Start Lightpanda
        run: |
          image=lightpanda/browser@sha256:01eb5d37ba537259d60ebfe32be49d3db4c7b6d1daac23b59b8532126fe30df0
          for attempt in 1 2 3 4 5; do
            docker pull --quiet "$image" && break
            test "$attempt" = 5 && exit 1
            sleep $((attempt * 15))
          done
          docker run --detach --name lightpanda --network host \
            --env LIGHTPANDA_DISABLE_TELEMETRY=true \
            "$image" \
            /bin/lightpanda serve --host 127.0.0.1 --port 9222 --log_level warn
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:9222/json/version
      - run: pnpm test:e2e:lightpanda
        env:
          LIGHTPANDA_CDP_URL: http://127.0.0.1:9222

  container:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-yuma-dingodocs-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Pull Docker Hub base images through ECR Public; CodeBuild's shared
          # egress IPs hit Docker Hub's anonymous pull limit.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["public.ecr.aws/docker"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: dingodocs:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dingodocs:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-yuma-dingodocs-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan git history with Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
