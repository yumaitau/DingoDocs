name: Tester Army browser coverage

# Browser coverage runs nightly only, never in push or pull-request CI.
on:
  schedule:
    - cron: '0 15 * * *' # 02:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-yuma-dingodocs-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [desktop, mobile]
    services:
      postgres:
        # ECR Public mirror of the Docker Hub image (same digest). Avoids Docker
        # Hub anonymous pull limits on shared CodeBuild egress IPs.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: dingodocs_e2e
          POSTGRES_USER: dingodocs
          POSTGRES_PASSWORD: dingodocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dingodocs -d dingodocs_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dingodocs:dingodocs@127.0.0.1:5432/dingodocs_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The CodeBuild runner is Amazon Linux 2023 (no apt), so install
      # Chromium's runtime libraries with dnf instead of --with-deps.
      - name: Install Chromium system libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          alsa-lib atk at-spi2-atk at-spi2-core cairo cups-libs dbus-libs
          libdrm libX11 libxcb libXcomposite libXdamage libXext libXfixes
          libxkbcommon libXrandr mesa-libgbm nspr nss pango
      - run: pnpm exec e2e-web install chromium
      - run: pnpm test:e2e:army --target ${{ matrix.target }}
      - name: Summarize browser results
        if: always()
        run: |
          if test -f .e2e/summary.md; then
            cat .e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
