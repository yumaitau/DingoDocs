name: E2E nightly

# Playwright and Lightpanda suites run here only, never in push or pull-request CI.
# Tester Army browser coverage runs nightly from testerarmy.yml.
on:
  schedule:
    - cron: "0 15 * * *" # 02:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-yuma-dingodocs-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    services:
      postgres:
        # ECR Public mirror of the Docker Hub image (same digest). Avoids Docker
        # Hub anonymous pull limits on shared CodeBuild egress IPs.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: dingodocs_test
          POSTGRES_USER: dingodocs
          POSTGRES_PASSWORD: dingodocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dingodocs -d dingodocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      TEST_DATABASE_URL: postgres://dingodocs:dingodocs@localhost:5432/dingodocs_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # The CodeBuild runner is Amazon Linux 2023 (no apt), so install
      # Chromium's runtime libraries with dnf instead of --with-deps.
      - name: Install Chromium system libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          alsa-lib atk at-spi2-atk at-spi2-core cairo cups-libs dbus-libs
          libdrm libX11 libxcb libXcomposite libXdamage libXext libXfixes
          libxkbcommon libXrandr mesa-libgbm nspr nss pango
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      # The Lightpanda 0.4.0 aarch64 binary needs glibc 2.38 and Amazon Linux
      # 2023 ships 2.34, so run the same release from its official arm64 image.
      - name: Start Lightpanda
        run: |
          image=lightpanda/browser@sha256:01eb5d37ba537259d60ebfe32be49d3db4c7b6d1daac23b59b8532126fe30df0
          for attempt in 1 2 3 4 5; do
            docker pull --quiet "$image" && break
            test "$attempt" = 5 && exit 1
            sleep $((attempt * 15))
          done
          docker run --detach --name lightpanda --network host \
            --env LIGHTPANDA_DISABLE_TELEMETRY=true \
            "$image" \
            /bin/lightpanda serve --host 127.0.0.1 --port 9222 --log_level warn
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:9222/json/version
      - run: pnpm test:e2e:lightpanda
        env:
          LIGHTPANDA_CDP_URL: http://127.0.0.1:9222
