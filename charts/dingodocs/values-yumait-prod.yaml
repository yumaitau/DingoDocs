# Seller-hosted install on yumait-prod EKS (ap-southeast-2).
#
#   helm upgrade --install dingodocs charts/dingodocs \
#     --namespace dingodocs --create-namespace \
#     -f charts/dingodocs/values-yumait-prod.yaml
#
# RDS is in the overlapping 10.80.0.0/16 VPC. Do not cut traffic until
# PrivateLink or a DB move is in place. Service account name must stay
# `dingodocs`.

fullnameOverride: dingodocs
replicaCount: 1

image:
  repository: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/dingodocs/app@sha256
  tag: "282ffd2f01014896e11cd7c60844ea1d8d877a677d5c3ffd63b892f68b0e7fb0" # sha-ef87c34-amd64
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: true
  name: dingodocs

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: "0.0.0.0"
  S3_BUCKET: dingodocs-prod-evidence-10ac01752a5d9fd7ae88324668
  AWS_REGION: ap-southeast-2
  S3_REGION: ap-southeast-2
  STORAGE_PROVIDER: s3
  CRON_TIMEZONE: Australia/Sydney
  REQUIRE_EMAIL_VERIFICATION: "false"
  EMAIL_PROVIDER: none
  SIGN_UP_MODE: invite
  # Platform admin (justin@yumait.com.au). Comma-separated user ids.
  BETTER_AUTH_ADMIN_USER_IDS: 2487af8f-18d0-422a-a007-09cbe4118351
  BETTER_AUTH_URL: https://app.dingodocs.yumait.au
  TRUSTED_ORIGINS: https://app.dingodocs.yumait.au
  APP_URL: https://app.dingodocs.yumait.au

existingSecret: dingodocs-runtime

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  dataFrom:
    - dingodocs-eks-runtime

migration:
  # Apply pending Drizzle migrations in an init container before the web pod.
  enabled: true

web:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

ingress:
  enabled: true
  # Shared ALB group (k8s-yumaitshared-*) that Cloudflare fronts.
  className: alb-shared
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/ready
  hosts:
    - host: app.dingodocs.yumait.au
      paths:
        - path: /
          pathType: Prefix

nodeSelector:
  kubernetes.io/arch: amd64
