{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dingodocs.fullname" . }}-web
  labels:
    {{- include "dingodocs.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dingodocs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
