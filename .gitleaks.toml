title = "DingoDocs"

[extend]
useDefault = true

[[allowlists]]
description = "Finding-library stable keys are catalog identifiers, not credentials"
paths = [
  '''src/db/seeds/finding-library\.ts''',
]

[[allowlists]]
description = "BETTER_AUTH_ADMIN_USER_IDS holds user UUIDs, not credentials"
regexTarget = "line"
regexes = [
  '''^\s*BETTER_AUTH_ADMIN_USER_IDS:\s*"?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(,\s*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})*"?\s*$''',
]
