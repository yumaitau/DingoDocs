name: dingodocs

services:
  app:
    build: &app-build
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dingodocs:${POSTGRES_PASSWORD:-dingodocs}@postgres:5432/dingodocs
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_ROOT: /app/storage/data
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Australia/Sydney}
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: *app-build
    command: ["node", "dist/migrate.cjs"]
    environment:
      DATABASE_URL: postgres://dingodocs:${POSTGRES_PASSWORD:-dingodocs}@postgres:5432/dingodocs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dingodocs
      POSTGRES_USER: dingodocs
      # Production must set POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dingodocs}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingodocs -d dingodocs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Upstream minio/minio is archived and affected by CVE-2026-122267; use the
    # Chainguard build (fixed in RELEASE.2026-09-22T19-25-18Z). Pinned to the
    # multi-arch index digest of :latest as built 2026-11-04 (after the fix).
    # Free-tier Chainguard has no versioned tags; to bump, re-resolve the
    # digest of :latest and update it here.
    image: cgr.dev/chainguard/minio:latest@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    # The Chainguard image defaults to a non-root user, but existing minio_data
    # volumes were written by root under minio/minio. Keep root so they stay
    # writable; to drop it, chown the volume to the image uid and remove this.
    user: "0:0"
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dingodocs
      MINIO_ROOT_PASSWORD: dingodocs-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
  minio_data:
